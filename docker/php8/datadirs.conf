# Data folders: user uploads, unzipped archives and generated files.
# Nothing in them is code, so Apache never runs a script from them and ignores any
# .htaccess inside them (an uploaded .htaccess could otherwise turn any file into PHP).
# Plain <Directory> blocks because AllowOverride is not allowed in <DirectoryMatch>.
# Installed by www/docker/php8/Dockerfile into /etc/apache2/conf-enabled/.
# Hot install (no restart): docker cp this file into the container, apache2ctl -k graceful.

<Macro StraboDataDir $dir>
	<Directory "/srv/app/www/$dir">
		AllowOverride None
		Options -ExecCGI -Includes
		php_admin_flag engine off
		<FilesMatch "(?i)\.(php[0-9]*|phtml|phar|pht|phps|shtml|cgi|pl|py|sh)$">
			Require all denied
		</FilesMatch>
		<FilesMatch "^\.(htaccess|user\.ini)$">
			Require all denied
		</FilesMatch>
	</Directory>
</Macro>

Use StraboDataDir ziptemp
Use StraboDataDir ogrtemp
Use StraboDataDir arcfiles
Use StraboDataDir straboMicroFiles
Use StraboDataDir microview/smzFiles
Use StraboDataDir straboMicroView/smzFiles
Use StraboDataDir straboMicroDOI
Use StraboDataDir geotiff/upload/files
Use StraboDataDir geotiff/upload/maps
Use StraboDataDir dbimages
Use StraboDataDir db/dbimages
Use StraboDataDir jwtdb/dbimages
Use StraboDataDir expimages
Use StraboDataDir experimental/expimages
Use StraboDataDir profileimages
Use StraboDataDir doi/doiFiles
Use StraboDataDir fieldZips
Use StraboDataDir versions
Use StraboDataDir searchthumbs
Use StraboDataDir straboToolsImages
Use StraboDataDir serialize/serialized
Use StraboDataDir microLogs

UndefMacro StraboDataDir
